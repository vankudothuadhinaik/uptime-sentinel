# Uptime Sentinel Render Blueprint
#
# This file defines the API and a genuine continuous background worker.
# It intentionally does NOT create another database or a proxy.
#
# Before deploying this blueprint:
# 1. Create/configure the controlled private egress proxy.
# 2. Have the existing Render PostgreSQL internal URL ready.
# 3. Generate a unique JWT secret (at least 32 characters) in a password manager.
# 4. Enter DATABASE_URL, JWT_SECRET, and EGRESS_PROXY_URL through Render's
#    secret/environment-variable setup. Never commit real values here.
#
# The worker is a paid Render background worker on supported plans; review
# current pricing in the dashboard before deploying. Do not substitute a
# public web service for the worker.

services:
  - type: web
    name: uptime-sentinel-api
    runtime: docker
    repo: https://github.com/vankudothuadhinaik/uptime-sentinel
    branch: main
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EGRESS_PROXY_URL
        sync: false
      - key: EGRESS_PROXY_USERNAME
        sync: false
      - key: EGRESS_PROXY_PASSWORD
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: CHECK_USER_AGENT
        value: UptimeSentinel/0.1
      - key: RESULT_RETENTION_DAYS
        value: "30"
      - key: MAX_MONITORS_PER_USER
        value: "50"
      - key: MAX_RESPONSE_BYTES
        value: "65536"

  - type: worker
    name: uptime-sentinel-worker
    runtime: docker
    repo: https://github.com/vankudothuadhinaik/uptime-sentinel
    branch: main
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python worker.py
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EGRESS_PROXY_URL
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: CHECK_USER_AGENT
        value: UptimeSentinel/0.1
      - key: RESULT_RETENTION_DAYS
        value: "30"
      - key: MAX_MONITORS_PER_USER
        value: "50"
      - key: MAX_RESPONSE_BYTES
        value: "65536"
