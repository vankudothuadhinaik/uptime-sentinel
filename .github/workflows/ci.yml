name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://uptime:ci-password@localhost:5432/uptime_sentinel
      DATABASE_URL: postgresql+psycopg://uptime:ci-password@localhost:5432/uptime_sentinel
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uptime_sentinel
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U uptime -d uptime_sentinel"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pip install pip-audit==2.10.1
      - run: pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app worker.py migrations tests
      - run: alembic upgrade head
      - run: python -m pytest -vv -s tests/test_postgres_concurrency.py
      - run: python -m pytest -q
      - run: python -m compileall -q app worker.py tests migrations
      - run: pip-audit --skip-editable
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: DATABASE_URL=sqlite:///./ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite:///./ci.db alembic downgrade base
      - run: DATABASE_URL=sqlite:///./ci.db alembic upgrade head

  compose-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Compose environment
        run: |
          cp .env.example .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql+psycopg://uptime:change-me-local-only@postgres:5432/uptime_sentinel#' .env
      - name: Validate, build, and start Compose
        run: |
          docker compose config --quiet
          docker compose up --build --detach
      - name: Wait for API health
        run: curl --fail --retry 30 --retry-delay 2 http://127.0.0.1:8000/health/live
      - name: Show service state
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose
        if: always()
        run: docker compose down --remove-orphans

  proxy-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Require controlled proxy fixtures
        env:
          EGRESS_PROXY_TEST_URL: ${{ secrets.EGRESS_PROXY_TEST_URL }}
          EGRESS_PUBLIC_URL: ${{ secrets.EGRESS_PUBLIC_URL }}
          EGRESS_PRIVATE_URL: ${{ secrets.EGRESS_PRIVATE_URL }}
          EGRESS_REBIND_URL: ${{ secrets.EGRESS_REBIND_URL }}
          EGRESS_REDIRECT_URL: ${{ secrets.EGRESS_REDIRECT_URL }}
          EGRESS_BAD_TLS_URL: ${{ secrets.EGRESS_BAD_TLS_URL }}
        run: |
          test -n "$EGRESS_PROXY_TEST_URL"
          test -n "$EGRESS_PUBLIC_URL"
          test -n "$EGRESS_PRIVATE_URL"
          test -n "$EGRESS_REBIND_URL"
          test -n "$EGRESS_REDIRECT_URL"
          test -n "$EGRESS_BAD_TLS_URL"
          RUN_EGRESS_PROXY_INTEGRATION=1 \
            EGRESS_PROXY_TEST_URL="$EGRESS_PROXY_TEST_URL" \
            EGRESS_PUBLIC_URL="$EGRESS_PUBLIC_URL" \
            EGRESS_PRIVATE_URL="$EGRESS_PRIVATE_URL" \
            EGRESS_REBIND_URL="$EGRESS_REBIND_URL" \
            EGRESS_REDIRECT_URL="$EGRESS_REDIRECT_URL" \
            EGRESS_BAD_TLS_URL="$EGRESS_BAD_TLS_URL" \
            python -m pytest -q tests/test_egress_proxy_integration.py
