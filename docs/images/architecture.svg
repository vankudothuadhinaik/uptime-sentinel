<text x="410" y="260" fill="#d4f06a" font-size="14" font-weight="700">APPLICATION</text><text x="410" y="290" fill="#f6f0e6" font-size="20" font-weight="700">FastAPI</text><text x="410" y="312" fill="#b5c4d1" font-size="13">Health · status · incidents</text>
<text x="660" y="260" fill="#d4f06a" font-size="14" font-weight="700">SCHEDULER</text><text x="660" y="290" fill="#f6f0e6" font-size="20" font-weight="700">Worker</text><text x="660" y="312" fill="#b5c4d1" font-size="13">Leases · fencing · retries</text>
<text x="980" y="260" fill="#d4f06a" font-size="14" font-weight="700">EGRESS BOUNDARY</text><text x="980" y="290" fill="#f6f0e6" font-size="20" font-weight="700">Safe HTTP checker</text><text x="980" y="312" fill="#c8d9d0" font-size="13">Redirects off · bounded reads</text>
