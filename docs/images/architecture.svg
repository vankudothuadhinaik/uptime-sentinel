<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Uptime Sentinel architecture</title><desc id="desc">FastAPI API and background workers share PostgreSQL. Workers use an SSRF-aware checker and a required destination-validating egress proxy in production. GitHub Actions verifies tests and Compose startup.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#1c2c3b"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4f06a"/><stop offset="1" stop-color="#80c7bb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".2"/></filter></defs>
