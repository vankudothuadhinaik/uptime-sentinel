<text x="58" y="58" fill="#d4f06a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">SYSTEM OVERVIEW</text><text x="58" y="102" fill="#f6f0e6" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Uptime Sentinel</text><text x="58" y="132" fill="#b5c4d1" font-family="Inter,Arial,sans-serif" font-size="17">Observe endpoints · record checks · manage incidents</text>
