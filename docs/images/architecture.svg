<text x="660" y="548" fill="#d4f06a" font-size="13" font-weight="700">PRODUCTION REQUIREMENT</text><text x="660" y="570" fill="#f6f0e6" font-size="16">Destination-validating proxy</text></g>
<text x="60" y="595" fill="#91a5b6" font-family="Inter,Arial,sans-serif" font-size="13">CI validates code, migrations, concurrency, dependency audit and container health; live proxy enforcement is a separate release gate.</text>
