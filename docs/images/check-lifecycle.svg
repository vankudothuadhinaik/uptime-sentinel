<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Monitor check and incident lifecycle</title><desc id="desc">Worker claims a due monitor, performs a bounded HTTP check through egress controls, stores result, opens or increments an incident on failure, and resolves the incident on recovery.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#1c2c3b"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".2"/></filter></defs>
<rect width="1200" height="460" rx="28" fill="url(#bg)"/><text x="54" y="58" fill="#d4f06a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">CHECK LIFECYCLE</text><text x="54" y="100" fill="#f6f0e6" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="750">From scheduled check to recovery</text>
<g stroke="#80c7bb" stroke-width="3" fill="none"><path d="M250 210 H300"/><path d="M500 210 H550"/><path d="M750 210 H800"/><path d="M900 260 V320 H750"/><path d="M550 360 H500"/><path d="M350 320 V260"/></g><g fill="#80c7bb"><path d="M292 203 l10 7 -10 7z"/><path d="M542 203 l10 7 -10 7z"/><path d="M792 203 l10 7 -10 7z"/><path d="M758 313 l-8 7 8 7z"/><path d="M508 353 l-8 7 8 7z"/><path d="M343 268 l7 -10 7 10z"/></g>
<g filter="url(#shadow)"><rect x="55" y="160" width="195" height="100" rx="16" fill="#23394b" stroke="#436176"/><rect x="300" y="160" width="200" height="100" rx="16" fill="#23394b" stroke="#436176"/><rect x="550" y="160" width="200" height="100" rx="16" fill="#243b34" stroke="#7f9f63"/><rect x="800" y="160" width="345" height="100" rx="16" fill="#23394b" stroke="#436176"/><rect x="550" y="320" width="200" height="80" rx="16" fill="#243b34" stroke="#7f9f63"/><rect x="300" y="320" width="200" height="80" rx="16" fill="#4a2d31" stroke="#bd6d67"/></g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="152" y="194" fill="#d4f06a" font-size="13" font-weight="700">01 · CLAIM</text><text x="152" y="222" fill="#f6f0e6" font-size="18" font-weight="700">Due monitor</text><text x="152" y="242" fill="#b5c4d1" font-size="13">DB lease + fencing</text>
<text x="400" y="194" fill="#d4f06a" font-size="13" font-weight="700">02 · CHECK</text><text x="400" y="222" fill="#f6f0e6" font-size="18" font-weight="700">Bounded HTTP</text><text x="400" y="242" fill="#b5c4d1" font-size="13">SSRF + egress controls</text>
<text x="650" y="194" fill="#d4f06a" font-size="13" font-weight="700">03 · RECORD</text><text x="650" y="222" fill="#f6f0e6" font-size="18" font-weight="700">Check result</text><text x="650" y="242" fill="#c8d9d0" font-size="13">Status + latency</text>
<text x="972" y="194" fill="#d4f06a" font-size="13" font-weight="700">04 · OUTCOME</text><text x="972" y="222" fill="#f6f0e6" font-size="18" font-weight="700">2xx = healthy</text><text x="972" y="242" fill="#b5c4d1" font-size="13">Existing incident resolves</text>
<text x="650" y="349" fill="#d4f06a" font-size="13" font-weight="700">RECOVERY</text><text x="650" y="376" fill="#f6f0e6" font-size="17" font-weight="700">Resolve incident</text>
<text x="400" y="349" fill="#ffb3a8" font-size="13" font-weight="700">FAILURE</text><text x="400" y="376" fill="#f6f0e6" font-size="17" font-weight="700">Open / increment</text></g>
<text x="55" y="435" fill="#91a5b6" font-family="Inter,Arial,sans-serif" font-size="13">A failed check opens one incident; consecutive failures update it; the first successful check resolves it. Historical check rows are retention-cleaned.</text>
</svg>